[package]
name = "claude-desktop-zh-cn"
version = "0.1.0"
description = "Claude Desktop zh-CN launcher"
authors = ["local"]
edition = "2021"

[lib]
name = "claude_desktop_zh_cn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-desktop-zh-cn"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
